[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "race-supply-coordination"
version = "0.1.0"
description = "Race supply and station coordination training project"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
rag = [
    "numpy==2.2.6", "faiss-cpu==1.15.1", "rank-bm25==0.2.2", "jieba==0.42.1",
    "httpx==0.28.1", "python-dotenv==1.2.4", "tokenizers==0.23.3", "huggingface-hub==2.4.0",
    "onnxruntime-directml==1.23.0; sys_platform == 'win32'",
    "onnxruntime==1.23.0; sys_platform != 'win32'",
]
web = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "PyJWT==2.15.1", "pypdf==6.21.4", "jinja2==3.1.6"]

[project.scripts]
race-supply = "race_supply.main:main"
race-supply-rag = "race_supply.phase1_rag:main"
race-supply-manage = "race_supply.manage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
race_supply = ["static/*.html", "static/*.js", "static/*.css", "templates/*.html"]
