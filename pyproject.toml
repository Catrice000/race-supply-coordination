[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "race-supply-coordination"
version = "0.1.0"
description = "Race supply and station coordination training project"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
race-supply = "race_supply.main:main"
race-supply-rag = "race_supply.phase1_rag:main"

[tool.setuptools.packages.find]
where = ["src"]
